name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Portable / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
          - { target: linux-x64, runner: ubuntu-22.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build native archive and smoke test
        shell: bash
        run: |
          npm run release:build -- --target "$TARGET" --out-dir release-out
          version=$(node -p 'require("./package.json").version')
          archive="release-out/rigup-$version-$TARGET.tar.gz"
          bundle=release-out/upload
          mkdir "$bundle"
          npm run --silent release:check -- "$archive" > "$bundle/$TARGET-smoke.json"
          if [[ "$TARGET" == darwin-arm64 ]]; then
            node scripts/release/check-native.mjs "$archive" > "$bundle/$TARGET-native.json"
          fi
          if [[ "$TARGET" == linux-x64 ]]; then
            mv "release-out/rigup-$version.tgz" "$bundle/"
          fi
          mv "$archive" "release-out/$TARGET.json" "$bundle/"
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rigup-${{ matrix.target }}
          path: release-out/upload/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  publish:
    name: Publish verified prerelease
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'ansonli-dev/rigup'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rigup-*
          path: release-out/artifacts
      - name: Verify and publish assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish.mjs publish release-out/artifacts release-out/publish
