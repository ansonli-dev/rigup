name: Native Superpowers hosts
on:
  push:
    branches: ['codex/rigup-75']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Verify Windows filesystem helper
        if: runner.os == 'Windows'
        run: node --import tsx scripts/probe-native-windows-acl.mjs
      - name: Verify genuine native installs through a terminal
        run: node scripts/live-native-hosts.mjs "${{ runner.temp }}/native-host-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-superpowers-${{ matrix.os }}
          path: ${{ runner.temp }}/native-host-evidence
          if-no-files-found: error
          retention-days: 14
